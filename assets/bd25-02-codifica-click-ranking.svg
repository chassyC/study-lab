<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1020" width="360" height="1020" role="img" aria-labelledby="bd25-encoding-click-loop19-title bd25-encoding-click-loop19-desc" style="max-width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><title id="bd25-encoding-click-loop19-title">Codifica dei dati e circuito click–ranking</title><desc id="bd25-encoding-click-loop19-desc">Due pannelli. A: le schede ipotetiche A,B,A,A,B danno tre consegne e due ritiri, controllando ambiguità e duplicati. B: interazioni influenzano stima, ranking ed esposizione, che possono modificare i click successivi. Dieci click su cento e cento su mille hanno lo stesso CTR del dieci per cento; non provano uguale interesse o utilità.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3157ad"/></marker></defs><rect width="360" height="1020" fill="white"/><text x="20" y="30" font-size="20" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="20" dy="0">A · Dalla categoria al conteggio</tspan></text><text x="20" y="62" font-size="14" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="20" dy="0">Esempio ordini, non scheda storica</tspan></text><rect x="20" y="80" width="320" height="80" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="34" y="107" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Definisci due categorie</tspan></text><text x="34" y="132" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">A = domicilio · B = ritiro</tspan></text><path d="M180 160v20" stroke="#3157ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="187" width="320" height="80" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="34" y="214" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Codifica un ordine per scheda</tspan></text><text x="34" y="239" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Posizioni concordate A oppure B</tspan></text><path d="M180 267v20" stroke="#3157ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="26" y="320" font-size="22" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="26" dy="0">A     B     A     A     B</tspan></text><text x="20" y="352" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="20" dy="0">5 schede → lettura → A: 3 / B: 2</tspan></text><rect x="20" y="375" width="320" height="100" rx="12" fill="#fff0d6" stroke="#9aafc8"/><text x="34" y="402" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Controlla il significato</tspan></text><text x="34" y="427" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Due fori o nessuno: caso da</tspan><tspan x="34" dy="23">verificare, non da indovinare.</tspan></text><text x="20" y="520" font-size="20" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="20" dy="0">B · Click, ranking ed esposizione</tspan></text><text x="20" y="550" font-size="14" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="20" dy="0">Modello concettuale ipotetico</tspan></text><rect x="20" y="570" width="295" height="80" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="34" y="597" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Interazioni osservate</tspan></text><text x="34" y="622" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Click ≠ utilità o soddisfazione</tspan></text><path d="M165 650v20" stroke="#3157ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="677" width="295" height="80" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="34" y="704" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Stima → ranking</tspan></text><text x="34" y="729" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Ordina contenuti secondo segnali</tspan></text><path d="M165 757v20" stroke="#3157ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="784" width="295" height="80" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="34" y="811" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Esposizione</tspan></text><text x="34" y="836" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Più visibilità può cambiare i click</tspan></text><path d="M315 824 H339 V610 H318" fill="none" stroke="#3157ad" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="901" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="20" dy="0">A: 10 / 100 esposizioni = 10%</tspan><tspan x="20" dy="23">B: 100 / 1.000 esposizioni = 10%</tspan></text><text x="20" y="961" font-size="15" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="20" dy="0">CTR uguale non prova stesso gusto.</tspan><tspan x="20" dy="23">Confronta pubblico, posizione, periodo.</tspan></text></svg>
