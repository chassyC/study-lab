<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 930" width="360" height="930" role="img" aria-labelledby="bd25-iot-edge-fallback19-title bd25-iot-edge-fallback19-desc" style="max-width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><title id="bd25-iot-edge-fallback19-title">IoT, edge, sistema centrale e fallback</title><desc id="bd25-iot-edge-fallback19-desc">Una lavatrice genera dati; l’edge controlla una condizione localmente e un tecnico verifica. I riepiloghi possono alimentare il confronto centrale. Dati mancanti o affidabilità insufficiente richiedono un percorso alternativo provato, con responsabilità e tempi. Nessuna soglia percentuale generale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3157ad"/></marker></defs><rect width="360" height="930" fill="white"/><text x="20" y="30" font-size="20" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="20" dy="0">IoT: dati connessi,</tspan><tspan x="20" dy="23">decisioni in luoghi diversi</tspan></text><text x="20" y="83" font-size="14" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="20" dy="0">Esempio ipotetico · non dati reali</tspan></text><rect x="20" y="105" width="320" height="78" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="34" y="132" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">1 · Sensore della lavatrice</tspan></text><text x="34" y="157" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Vibrazione + macchina + ora</tspan></text><path d="M180 183v22" stroke="#3157ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="210" width="320" height="105" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="34" y="237" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">2 · Edge: elaborazione locale</tspan></text><text x="34" y="262" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Controlla una condizione</tspan><tspan x="34" dy="23">vicino alla sorgente.</tspan></text><path d="M180 315v23" stroke="#3157ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="345" width="320" height="105" rx="12" fill="#e7f4e5" stroke="#9aafc8"/><text x="34" y="372" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">3 · Tecnico: verifica e agisce</tspan></text><text x="34" y="397" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Allarme ≠ guasto dimostrato.</tspan><tspan x="34" dy="23">Registra esito e falso allarme.</tspan></text><text x="20" y="484" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="20" dy="0">Riepiloghi al centro remoto</tspan><tspan x="20" dy="23">quando la connessione lo consente.</tspan></text><path d="M180 525v23" stroke="#3157ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="555" width="320" height="100" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="34" y="582" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">4 · Analisi centrale</tspan></text><text x="34" y="607" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Confronta sedi e periodi</tspan><tspan x="34" dy="23">con dati compatibili.</tspan></text><rect x="20" y="685" width="320" height="125" rx="12" fill="#fff0d6" stroke="#9aafc8"/><text x="34" y="712" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Se mancano dati o affidabilità</tspan></text><text x="34" y="737" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Segnala il limite → percorso</tspan><tspan x="34" dy="23">alternativo già verificato →</tspan><tspan x="34" dy="23">responsabile e tempo limite.</tspan></text><text x="20" y="846" font-size="15" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="20" dy="0">Fallback ≠ fiducia automatica.</tspan><tspan x="20" dy="23">Nessuna soglia % universale.</tspan><tspan x="20" dy="23">IoT non implica edge computing.</tspan></text></svg>
