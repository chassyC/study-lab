<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1120" width="360" height="1120" role="img" aria-labelledby="bd25-multimodal-value-roles19-title bd25-multimodal-value-roles19-desc" style="max-width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><title id="bd25-multimodal-value-roles19-title">Prove multimodali e ruoli nella proposta di valore</title><desc id="bd25-multimodal-value-roles19-desc">Due pannelli. A: una pratica e una immagine devono riferirsi allo stesso bene e momento; una foto del tetto nord non verifica un danno a sud. Nessuna intenzione è dedotta dall’immagine. B: utilizzatore, beneficiario e pagante sono ruoli distinti che possono coincidere; l’utilità operativa non prova disponibilità a finanziare il servizio.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3157ad"/></marker></defs><rect width="360" height="1120" fill="white"/><text x="20" y="30" font-size="20" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="20" dy="0">A · Pratica e immagine:</tspan><tspan x="20" dy="23">stesso oggetto, momento utile</tspan></text><text x="20" y="84" font-size="14" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="20" dy="0">Esempio ipotetico: danno al tetto</tspan></text><rect x="20" y="105" width="154" height="115" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="34" y="132" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Pratica</tspan></text><text x="34" y="157" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Bene + evento</tspan><tspan x="34" dy="23">Danno dichiarato</tspan></text><rect x="186" y="105" width="154" height="115" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="200" y="132" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="200" dy="0">Immagine</tspan></text><text x="200" y="157" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="200" dy="0">Luogo + ora</tspan><tspan x="200" dy="23">Campo visivo</tspan></text><path d="M97 220 V240 H180 M263 220 V240 H180 V260" stroke="#3157ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="270" width="320" height="100" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="34" y="297" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Controllo prima del confronto</tspan></text><text x="34" y="322" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Identità, data, provenienza,</tspan><tspan x="34" dy="23">campo visivo e qualità.</tspan></text><path d="M180 370v20" stroke="#3157ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="397" width="320" height="100" rx="12" fill="#fff0d6" stroke="#9aafc8"/><text x="34" y="424" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Tetto sud, foto solo da nord</tspan></text><text x="34" y="449" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Esito: informazione insufficiente.</tspan><tspan x="34" dy="23">Richiedi una vista pertinente.</tspan></text><text x="20" y="531" font-size="15" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="20" dy="0">Non visibile ≠ inesistente.</tspan><tspan x="20" dy="23">Una foto non dimostra intenzione,</tspan><tspan x="20" dy="23">causa, copertura o rimborso.</tspan></text><text x="20" y="630" font-size="20" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="20" dy="0">B · Chi usa, beneficia e paga?</tspan></text><text x="20" y="660" font-size="14" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="20" dy="0">Esempio ipotetico: riordino negozio</tspan></text><rect x="20" y="680" width="320" height="80" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="34" y="707" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">USER · Utilizzatore</tspan></text><text x="34" y="732" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Addetto: cambia quantità e tempi.</tspan></text><rect x="20" y="777" width="320" height="100" rx="12" fill="#e7f4e5" stroke="#9aafc8"/><text x="34" y="804" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">BENEFICIARY · Beneficiario</tspan></text><text x="34" y="829" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Negozio e clienti: possibile</tspan><tspan x="34" dy="23">migliore disponibilità.</tspan></text><rect x="20" y="894" width="320" height="100" rx="12" fill="#f1f5fb" stroke="#9aafc8"/><text x="34" y="921" font-size="17" font-weight="bold" fill="#162238" text-anchor="start"><tspan x="34" dy="0">PAYER · Pagante</tspan></text><text x="34" y="946" font-size="16" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="34" dy="0">Titolare / budget: valuta spesa,</tspan><tspan x="34" dy="23">condizioni e alternative.</tspan></text><text x="20" y="1030" font-size="15" font-weight="normal" fill="#162238" text-anchor="start"><tspan x="20" dy="0">Tre ruoli possibili, non tre tappe.</tspan><tspan x="20" dy="23">Utilità per l’addetto ≠ budget approvato.</tspan><tspan x="20" dy="23">Beneficio e pagamento vanno verificati.</tspan></text></svg>
